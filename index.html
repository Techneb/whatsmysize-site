<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's my size?</title>
<meta name="description" content="A Chrome extension that recommends your clothing size by comparing the garment with clothes you already own.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#fbfbf9;--ink:#15191b;--muted:#5d6a6e;--line:#e2e6e6;--accent:#2a5bd7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101415;--ink:#eef2f3;--muted:#98a8ac;--line:#243033;--accent:#7ea2ff;color-scheme:dark}}
*{box-sizing:border-box}
h1,h2,h3{font-family:Nunito,ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:64px 20px 48px}
img{width:96px;height:96px;border-radius:22px;display:block;margin-bottom:20px}
h1{font-size:30px;letter-spacing:-.01em;margin:0 0 8px}
p{margin:0 0 14px;max-width:34em}
.soon{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:14px;border:1px solid var(--line);color:var(--muted);font-size:15px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="">
  <h1>What's my size?</h1>
  <p>A Chrome extension that recommends your clothing size on a product page, by comparing the garment with clothes you already own.</p>
  <span class="soon">Coming soon to the Chrome Web Store</span>
  <footer>By <a href="https://alephb.uk">AlephB</a> · <a href="mailto:contact@alephb.uk">contact@alephb.uk</a></footer>
</main>
</body>
</html>
